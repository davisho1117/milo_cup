<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f4ecd2">
    <title>BEYBLADE X Milo Cup - 1930s 版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 橡皮管動畫 經典黃金配色 */
            --ch-bg: #f4ecd2;      /* 舊黃色羊皮紙底色 */
            --ch-black: #2b2b2a;   /* 濃墨汁黑 */
            --ch-red: #cc3333;     /* 復古卡通紅 */
            --ch-blue: #3b6fa6;    /* 復古牛仔藍 */
            --ch-yellow: #f2be42;  /* 奶油金黃 */
            --ch-white: #fffdf0;   /* 賽璐璐片白 */
            
            --primary: var(--ch-red);
            --gold: var(--ch-yellow);
            --panel: var(--ch-white);
            --text: var(--ch-black);
            --border: var(--ch-black);
            
            --sb-p1-color: var(--ch-blue);
            --sb-p2-color: var(--ch-red);
            --sb-bg-color: #ede2c4;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: 'Fredoka One', 'Bowlby One SC', 'Segoe UI', cursive, sans-serif;
        }

        /* 復古老電影膠卷 噪點特效 */
        body {
            background-color: var(--ch-bg);
            color: var(--ch-black);
            margin: 0; padding: 0;
            min-height: 100dvh;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 999;
        }

        /* 厚重墨汁邊框與粗重陰影 */
        .ch-box {
            background: var(--ch-white);
            border: 4px solid var(--ch-black);
            border-radius: 16px;
            box-shadow: 5px 5px 0px 0px var(--ch-black);
        }

        .ch-btn {
            background: var(--ch-yellow);
            color: var(--ch-black);
            border: 3px solid var(--ch-black);
            border-radius: 12px;
            box-shadow: 3px 3px 0px 0px var(--ch-black);
            font-weight: 900;
            transition: all 0.1s;
        }
        .ch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px 0px var(--ch-black);
        }

        /* 分頁按鈕樣式切換 */
        .tab-btn {
            padding: 8px 18px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-active {
            background-color: var(--ch-red) !important;
            color: var(--ch-white) !important;
        }
        .tab-inactive {
            background-color: var(--ch-white) !important;
            color: var(--ch-black) !important;
        }

        /* 對戰組合外框 */
        .match-row { 
            background: #faf2d3; 
            border: 2px solid var(--ch-black); 
            border-radius: 10px; 
            margin-bottom: 8px;
        }
        .score-box { 
            display: inline-block; 
            min-width: 32px; height: 32px; 
            line-height: 28px; text-align: center; 
            background: var(--ch-white); 
            border: 2px solid var(--ch-black); 
            border-radius: 6px; 
            color: var(--ch-red); 
            font-weight: 900;
        }

        .matchup { border: 3px solid var(--ch-black); border-radius: 12px; background: var(--ch-white); overflow: hidden; box-shadow: 3px 3px 0px 0px var(--ch-black); }
        .matchup-title { text-align: center; padding: 4px; background: var(--ch-yellow); color: var(--ch-black); border-bottom: 3px solid var(--ch-black); font-size: 0.85rem; }
        .matchup.gold { border-color: var(--ch-red); }
        .matchup.gold .matchup-title { background: var(--ch-red); color: var(--ch-white); }

        /* ================= ⚔️ 電子計分板 (響應式優化) ================= */
        #scoreboard-screen { 
            background-color: var(--sb-bg-color); 
            height: calc(100dvh - 56px); 
            width: 100%; 
            overflow: hidden; 
            flex-direction: column; 
        }
        .sb-settings-bar { 
            background: var(--ch-yellow); 
            border-bottom: 4px solid var(--ch-black); 
            padding: 0 12px; 
            height: 52px; 
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        /* 平板/桌面版與手機版的卡片容器 */
        .sb-main-arena { 
            display: flex;
            flex-direction: column;
            flex: 1; 
            padding: 12px; 
            gap: 12px; 
            overflow: hidden; 
            height: 100%;
        }

        /* 經典老卡通卡片風格 */
        .sb-player-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--ch-white);
            border: 4px solid var(--ch-black);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 4px 4px 0px 0px var(--ch-black);
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* 使用顏色區分選手邊界 */
        .sb-player-card.p1-card {
            border-color: var(--sb-p1-color);
            box-shadow: 4px 4px 0px 0px var(--sb-p1-color);
        }
        .sb-player-card.p2-card {
            border-color: var(--sb-p2-color);
            box-shadow: 4px 4px 0px 0px var(--sb-p2-color);
        }

        /* 巨大比分按鈕 */
        .sb-score-tap-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            flex: 1;
            min-height: 80px;
        }

        .sb-score-display {
            font-size: clamp(4.5rem, 12vh, 8.5rem);
            font-weight: 900;
            line-height: 1;
            user-select: none;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .sb-score-display:active {
            transform: scale(0.92);
        }

        /* 雙方選手卡片中的名字輸入框 */
        .sb-name-input {
            font-size: clamp(1.2rem, 3.5vh, 1.8rem);
            font-weight: 900;
            background: transparent;
            border: none;
            color: var(--ch-black);
            border-bottom: 3px dashed var(--ch-black);
            width: 100%;
            text-align: center;
            padding-bottom: 2px;
        }

        /* 網格功能按鈕 */
        .sb-btn-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
        }

        .sb-action-btn {
            background: var(--ch-white);
            border: 3px solid var(--ch-black);
            border-radius: 12px;
            color: var(--ch-black);
            padding: 8px 4px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 2px 2px 0px 0px var(--ch-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }
        .sb-action-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px 0px var(--ch-black);
        }

        .sb-action-btn.btn-dash { background: var(--ch-yellow); }

        /* 快速加減微調按鈕 */
        .sb-quick-adjust-btn {
            width: clamp(44px, 8vh, 60px);
            height: clamp(44px, 8vh, 60px);
            border-radius: 50%;
            border: 3px solid var(--ch-black);
            font-size: 1.8rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0px 0px var(--ch-black);
            transition: all 0.1s;
            background: white;
            user-select: none;
        }
        .sb-quick-adjust-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px 0px var(--ch-black);
        }

        /* 勝利大彈窗 */
        .sb-victory-screen { position: fixed; inset: 0; background: rgba(244, 236, 210, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 500; }
        .sb-victory-screen.active { opacity: 1; pointer-events: auto; }
        .sb-winner-banner { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; color: var(--ch-red); -webkit-text-stroke: 3px var(--ch-black); text-shadow: 5px 5px 0px var(--ch-black); }

        table { width: 100%; border-collapse: collapse; background: var(--ch-white); }
        th, td { border: 3px solid var(--ch-black); padding: 8px; text-align: center; color: var(--ch-black); }
        th { background: var(--ch-yellow); font-weight: 900; }

        /* 🖥️ 平板與桌面寬螢幕排版自適應 (左右對稱大佈局) */
        @media (min-width: 768px) {
            .sb-main-arena {
                flex-direction: row;
                padding: 24px;
                gap: 24px;
            }
            .sb-player-card {
                padding: 24px;
            }
            .sb-btn-grid {
                gap: 10px;
            }
            .sb-action-btn {
                padding: 12px 6px;
            }
        }

        /* 復古卡通動畫特效 */
        @keyframes cartoon-wobble {
            0%, 100% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg) scale(1.02); }
        }
        
        .animate-wobble {
            display: inline-block;
            animation: cartoon-wobble 5s ease-in-out infinite;
        }

        /* 呼吸動畫 */
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .pulse-active {
            animation: pulse-subtle 2s infinite ease-in-out;
        }
        
        /* 比分變更閃爍動畫 */
        @keyframes flash-green {
            0%, 100% { background-color: var(--ch-white); }
            50% { background-color: rgba(34, 197, 94, 0.2); }
        }
        .score-changed {
            animation: flash-green 0.5s ease-out;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 2s infinite ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <div class="top-bar w-full flex justify-between items-center px-4 py-2 border-b-4 border-black bg-[#faf2d3]">
        <div class="flex items-center gap-3">
            <div class="font-black text-black text-lg uppercase tracking-wider hidden sm:block">BEYBLADE X</div>
            <div id="nav-tabs" class="hidden flex gap-2">
                <button id="tab-btn-main" class="ch-btn tab-btn tab-active">🏆 賽程</button>
                <button id="tab-btn-score" class="ch-btn tab-btn tab-inactive hidden">⚔️ 計分</button>
                <button id="tab-btn-raffle" class="ch-btn tab-btn tab-inactive">🎁 抽獎</button>
            </div>
        </div>

        <div class="flex gap-2 items-center">
            <button class="ch-btn px-4 py-1.5 text-sm" onclick="toggleFullScreen()" id="fs-btn">🔲 全螢幕</button>
            <div id="user-info" class="text-sm hidden items-center">
                <span id="role-badge" class="px-3 py-1 border-2 border-black rounded-lg text-xs font-black mr-2"></span>
                <button onclick="logout()" class="text-gray-400 underline text-xs font-bold">切換</button>
            </div>
        </div>
    </div>

    <!-- 🏆 主賽程面板 (預設顯示) 🏆 -->
    <div id="app-container" class="w-full flex-1 flex flex-col items-center pb-20 px-4 overflow-y-auto">
        <div class="text-center my-6 w-full">
            <h1 class="text-4xl md:text-5xl font-black uppercase text-[#cc3333] tracking-widest animate-wobble" style="-webkit-text-stroke: 2px #2b2b2a; text-shadow: 4px 4px 0px #2b2b2a;">BEYBLADE X Milo Cup</h1>
            <div class="flex flex-wrap items-center justify-center gap-2 mt-2">
                <p id="system-status" class="text-gray-700 font-bold text-sm tracking-wide">連線中...</p>
                <button id="share-btn" class="ch-btn px-2.5 py-0.5 text-xs bg-white text-black flex items-center gap-1 hidden pulse-active" onclick="copyShareLink()">
                    🔗 分享賽程
                </button>
            </div>
        </div>

        <div id="loading-screen" class="w-full max-w-md p-8 text-center hidden"><p class="font-bold text-xl">⏳ 正在載入老舊賽事膠卷...</p></div>

        <div id="login-screen" class="w-full max-w-md p-6 ch-box hidden mx-4 my-4">
            <h2 class="text-2xl text-[#cc3333] font-black border-b-4 border-black pb-2 mb-6 text-center">請選擇您的身分</h2>
            <div class="mb-8 text-center">
                <h3 class="font-black mb-3 text-left text-black">👤 我是參賽選手</h3>
                <select id="player-select" class="w-full p-3 rounded-xl border-3 border-black font-bold mb-4 bg-white text-black"></select>
                <button onclick="loginAsPlayer()" class="w-full ch-btn p-3 text-lg">進入選手儀表板</button>
            </div>
            <div class="border-t-4 border-dashed border-black pt-6">
                <button onclick="loginAsAdmin()" class="w-full ch-btn bg-stone-300 p-3 text-lg">👑 進入主辦控制台</button>
            </div>
        </div>

        <div id="setup-screen" class="w-full max-w-2xl p-6 ch-box hidden mx-4 my-4">
            <h2 class="text-2xl text-[#cc3333] font-black border-b-4 border-black pb-2 mb-6">⚙️ 建立新賽事</h2>
            <div class="flex flex-col gap-2 mb-6">
                <label class="text-black font-black">1. 請輸入參賽選手名單（一人一列）</label>
                <textarea id="playerList" class="p-4 rounded-xl border-3 border-black h-40 font-bold bg-white text-black" placeholder="選手A&#10;選手B"></textarea>
            </div>
            <div class="flex flex-col gap-2 mb-6">
                <label class="text-black font-black">2. 選擇大會賽制</label>
                <select id="tournamentFormat" class="p-3 rounded-xl border-3 border-black font-bold bg-white" onchange="toggleGroupCount()">
                    <option value="group">🔥 小組賽 + 複賽/決賽</option>
                    <option value="knockout">⚔️ 直接單淘汰賽 (自動配籤)</option>
                </select>
            </div>
            <div class="flex flex-col gap-4 mb-6" id="groupCountContainer">
                <div class="flex flex-col gap-2">
                    <label class="text-black font-black">3. 預賽要分成幾組？</label>
                    <select id="groupCount" class="p-3 rounded-xl border-3 border-black font-bold bg-white">
                        <option value="2">2 組</option><option value="3" selected>3 組</option><option value="4">4 組</option>
                        <option value="5">5 組</option><option value="6">6 組</option><option value="7">7 組</option>
                        <option value="8">8 組</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-yellow-50 p-4 border-2 border-black rounded-xl">
                    <div class="flex flex-col gap-1">
                        <label class="text-black font-black text-sm">4. 每組取幾名晉級？</label>
                        <select id="advancingPerGroup" class="p-2.5 rounded-lg border-2 border-black font-bold bg-white text-sm">
                            <option value="1">1 人 (冠軍晉級)</option>
                            <option value="2" selected>2 人 (前2名晉級 - 預設)</option>
                            <option value="3">3 人 (前3名晉級)</option>
                            <option value="4">4 人 (前4名晉級)</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-black font-black text-sm">5. 決賽/複賽 賽制架構</label>
                        <select id="playoffFormat" class="p-2.5 rounded-lg border-2 border-black font-bold bg-white text-sm">
                            <option value="standard" selected>🌳 標準單淘汰賽 (含季軍戰)</option>
                            <option value="six_to_three">🔥 6強對決 ➔ 3強決賽單循環 (0輪空)</option>
                            <option value="full_rr">👑 晉級者全單循環大決戰 (總積分榜)</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-row items-center gap-2 px-1">
                    <input type="checkbox" id="avoidSameGroup" class="w-5 h-5 accent-red-600 border-2 border-black rounded cursor-pointer" checked>
                    <label for="avoidSameGroup" class="text-black font-bold text-sm cursor-pointer">🛡️ 淘汰賽/複賽首輪自動避開預賽同組對手</label>
                </div>
            </div>

            <!-- 比賽目標得分設定 -->
            <div class="flex flex-col gap-3 mb-6 bg-yellow-50 p-4 border-2 border-black rounded-xl">
                <label class="text-black font-black">🎯 比賽勝負目標得分設定</label>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-gray-700 block mb-1">預賽/小組賽得分目標</label>
                        <select id="groupTargetScore" class="w-full p-2 rounded-lg border-2 border-black font-bold bg-white text-sm">
                            <option value="4" selected>先得 4 分勝 (標準)</option>
                            <option value="5">先得 5 分勝</option>
                            <option value="6">先得 6 分勝</option>
                            <option value="7">先得 7 分勝 (大決賽)</option>
                            <option value="8">先得 8 分勝</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-700 block mb-1">複賽/決賽得分目標</label>
                        <select id="playoffTargetScore" class="w-full p-2 rounded-lg border-2 border-black font-bold bg-white text-sm">
                            <option value="4">先得 4 分勝</option>
                            <option value="5" selected>先得 5 分勝 (標準決賽)</option>
                            <option value="6">先得 6 分勝</option>
                            <option value="7">先得 7 分勝 (高階決賽)</option>
                            <option value="8">先得 8 分勝</option>
                        </select>
                    </div>
                </div>
            </div>
            <button onclick="triggerAuthModal('create')" class="w-full ch-btn bg-[#cc3333] text-white p-4 text-xl">🚀 產生並發布賽程</button>
        </div>

        <div id="main-board-screen" class="w-full max-w-6xl px-2 hidden">
            <div id="player-dashboard" class="mb-8 ch-box border-[#cc3333] p-4 hidden bg-[#fffdf0]">
                <div class="flex items-center gap-3 mb-2"><span class="text-2xl">🔥</span><h3 class="text-xl font-black text-[#cc3333]">您的下一場賽事</h3></div>
                <div id="next-match-content" class="bg-[#faf2d3] rounded-xl p-4 text-center border-2 border-black font-bold text-black"></div>
            </div>
            
            <div id="admin-group-actions" class="w-full text-center mb-8 hidden">
                <button onclick="advanceGroupWinners()" class="ch-btn bg-gradient-to-r from-amber-500 to-yellow-400 px-8 py-3.5 text-xl font-black">🚀 預賽結束：一鍵生成決賽名單</button>
                <p class="text-xs text-red-700 font-bold mt-2">💡 小提示：若出現平手，請現場進行【1分突死賽】，並直接於下方表格名次欄修改數字後再行結算！</p>
            </div>

            <div id="groups-container" class="flex flex-wrap gap-6 justify-center mb-10"></div>
            
            <div id="knockout-section" class="ch-box p-6 w-full hidden bg-[#fffdf0] mb-12">
                <h2 id="knockout-title" class="text-2xl text-[#cc3333] border-b-4 border-black pb-3 mb-6 text-center font-black">🏆 決賽階段</h2>
                <div id="knockout-container" class="grid gap-6"></div>
            </div>
            
            <div id="admin-controls" class="mt-12 text-center hidden">
                <button onclick="triggerAuthModal('delete')" class="border-3 border-black bg-red-100 text-red-700 font-black px-6 py-2 rounded-xl hover:bg-red-200 transition shadow-[3px_3px_0px_0px_rgba(0,0,0,1)]">⚠️ 刪除並重置整個賽事</button>
            </div>
        </div>

        <!-- 🎁 大會抽獎面板 (預設隱藏) 🎁 -->
        <div id="raffle-screen" class="w-full max-w-4xl px-2 hidden">
            <div class="ch-box p-6 w-full bg-[#fffdf0] mb-12">
                <h2 class="text-3xl text-[#cc3333] border-b-4 border-black pb-3 mb-6 text-center font-black">🎁 陀螺大會抽獎機</h2>
                
                <!-- 抽獎顯示區域 -->
                <div class="flex flex-col items-center justify-center py-10 bg-[#faf2d3] border-4 border-black rounded-2xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] relative overflow-hidden mb-8">
                    <!-- 電子跑馬燈特效 -->
                    <div class="absolute inset-x-0 top-0 h-4 bg-yellow-400 flex justify-around items-center border-b-2 border-black overflow-hidden">
                        <span class="w-2 h-2 rounded-full bg-red-600 animate-ping"></span>
                        <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                        <span class="w-2 h-2 rounded-full bg-green-600"></span>
                        <span class="w-2 h-2 rounded-full bg-yellow-600"></span>
                        <span class="w-2 h-2 rounded-full bg-purple-600"></span>
                    </div>
                    
                    <div class="text-gray-500 font-bold text-sm mb-2 uppercase tracking-widest">Lucky Draw Slot</div>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdMAx7dk55c_6z3alQenCG-FTONk0TkPY",
            authDomain: "milocup-live.firebaseapp.com",
            projectId: "milocup-live",
            storageBucket: "milocup-live.firebasestorage.app",
            messagingSenderId: "988514415331",
            appId: "1:988514415331:web:de2f269acbc03b12070bd6"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'milocup-live-data';

        // Parse dynamic tournament ID from query parameters or hash
        function getTournamentId() {
            const urlParams = new URLSearchParams(window.location.search);
            let tId = urlParams.get('t') || urlParams.get('tournament');
            if (!tId && window.location.hash) {
                tId = window.location.hash.substring(1);
            }
            return tId || 'main';
        }
        const tournamentId = getTournamentId();

        window.globalState = null;
        window.currentUser = null;
        window.userRole = localStorage.getItem(`role_${appId}_${tournamentId}`) || null;
        window.docRef = null;
        window.currentTab = 'main'; 
        
        let sbScores = { 1: 0, 2: 0 };
        let sbGameOver = false;
        let currentLoadedMatchContext = null; 
        let currentAuthAction = null;

        const colors = [
            { main: '#3b6fa6', bg: 'rgba(59, 111, 166, 0.08)' }, 
            { main: '#cc3333', bg: 'rgba(204, 51, 51, 0.08)' }, 
            { main: '#e67e22', bg: 'rgba(230, 126, 34, 0.08)' }, 
            { main: '#16a085', bg: 'rgba(22, 160, 133, 0.08)' }
        ];
        const groupLabels = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

        async function init() {
            showCoreScreen('loading-screen');
            if (!app) { showModal("Firebase 環境未設定。"); return; }
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.currentUser = user; 
                        window.docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tournament', tournamentId); 
                        listenToState();
                    }
                });
            } catch (e) { showModal("登入失敗: " + e.message); }
        }

        function listenToState() {
            onSnapshot(window.docRef, (snap) => {
                const shareBtn = document.getElementById('share-btn');
                if (snap.exists() && !snap.data().deleted) {
                    window.globalState = snap.data();
                    document.getElementById('system-status').innerText = '🟢 即時同步中'; 
                    document.getElementById('system-status').className = 'text-green-700 font-bold text-sm tracking-wide';
                    if (shareBtn) shareBtn.classList.remove('hidden');
                } else {
                    window.globalState = null;
                    document.getElementById('system-status').innerText = '⚪ 尚未建立賽事'; 
                    document.getElementById('system-status').className = 'text-gray-500 font-bold text-sm';
                    if (shareBtn) shareBtn.classList.add('hidden');
                }
                renderApp();
            }, (error) => { showModal("同步錯誤: " + error.message); });
        }

        window.switchTab = function(tabName) {
            window.currentTab = tabName;
            renderApp();
            syncTabsUI();
        }

        function syncTabsUI() {
            const btnMain = document.getElementById('tab-btn-main');
            const btnScore = document.getElementById('tab-btn-score');
            const btnRaffle = document.getElementById('tab-btn-raffle');
            const appContainer = document.getElementById('app-container');
            const scoreScreen = document.getElementById('scoreboard-screen');

            if (!btnMain || !btnScore || !appContainer || !scoreScreen) return;

            btnMain.className = 'ch-btn tab-btn ' + (window.currentTab === 'main' ? 'tab-active' : 'tab-inactive');
            btnScore.className = 'ch-btn tab-btn ' + (window.currentTab === 'score' ? 'tab-active' : 'tab-inactive');
            if (btnRaffle) {
                btnRaffle.className = 'ch-btn tab-btn ' + (window.currentTab === 'raffle' ? 'tab-active' : 'tab-inactive');
            }

            if (window.currentTab === 'main') {
                if (!currentLoadedMatchContext) {
                    btnScore.classList.add('hidden');
                }
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
                scoreScreen.classList.add('hidden');
                scoreScreen.classList.remove('flex');
            } else if (window.currentTab === 'score') {
                appContainer.classList.add('hidden');
                appContainer.classList.remove('flex');
                scoreScreen.classList.remove('hidden');
                scoreScreen.classList.add('flex');
            } else if (window.currentTab === 'raffle') {
                if (!currentLoadedMatchContext) {
                    btnScore.classList.add('hidden');
                }
                appContainer.classList.remove('hidden');
                appContainer.classList.add('flex');
                scoreScreen.classList.add('hidden');
                scoreScreen.classList.remove('flex');
            }
        }

        function showCoreScreen(id) {
            ['loading-screen', 'login-screen', 'setup-screen', 'main-board-screen', 'raffle-screen'].forEach(s => {
                if (document.getElementById(s)) document.getElementById(s).classList.add('hidden');
            });
            if (document.getElementById(id)) document.getElementById(id).classList.remove('hidden');
            syncTabsUI();
        }

        window.loadMatchToScoreboard = function(p1, p2, matchContext = null) {
            document.getElementById('sb-name-1').value = p1 || 'PLAYER 1';
            document.getElementById('sb-name-2').value = p2 || 'PLAYER 2';
            currentLoadedMatchContext = matchContext; 
            resetAllAndCloseSbVictory();
            
            if (matchContext && window.globalState) {
                let targetScore = 4;
                if (matchContext.type === 'group') {
                    targetScore = window.globalState.groupTargetScore || 4;
                } else {
                    targetScore = window.globalState.playoffTargetScore || 5;
                }
                const winSelect = document.getElementById('sb-winCondition');
                if (winSelect) winSelect.value = targetScore;
            }

            const btnScore = document.getElementById('tab-btn-score');
            if (btnScore) {
                btnScore.classList.remove('hidden');
            }
            window.switchTab('score'); 
        }

        function renderApp() {
            updateTopBar();
            if (!window.userRole) { renderLoginScreen(); showCoreScreen('login-screen'); return; }
            document.getElementById('nav-tabs').classList.remove('hidden');

            if (window.currentTab === 'raffle') {
                renderRaffleScreen();
                showCoreScreen('raffle-screen');
                return;
            }

            if (window.userRole === 'admin') {
                if (!window.globalState) showCoreScreen('setup-screen');
                else { renderMainBoard(); showCoreScreen('main-board-screen'); }
            } else {
                if (!window.globalState) { window.userRole = null; localStorage.removeItem(`role_${appId}_${tournamentId}`); renderApp(); return; }
                renderMainBoard(); showCoreScreen('main-board-screen');
            }
        }

        function updateTopBar() {
            const uiInfo = document.getElementById('user-info'); const badge = document.getElementById('role-badge');
            const btnScore = document.getElementById('tab-btn-score');
            
            if (window.userRole) {
                uiInfo.classList.remove('hidden'); uiInfo.classList.add('flex');

                        btnScore.classList.remove('hidden');

                        btnScore.classList.add('hidden');

                }
            } else { 
                uiInfo.classList.add('hidden'); 
                uiInfo.classList.remove('flex'); 
                document.getElementById('nav-tabs').classList.add('hidden'); 
            }
        }

        window.toggleFullScreen = function() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
                else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            }
        }

        window.toggleGroupCount = function() {
            const format = document.getElementById('tournamentFormat').value;
            if (format === 'group') document.getElementById('groupCountContainer').classList.remove('hidden'); 
            else document.getElementById('groupCountContainer').classList.add('hidden');
        }

        window.renderLoginScreen = function() {
            const select = document.getElementById('player-select');
            if (!select) return;
            if (window.globalState && window.globalState.players) {
                const realPlayers = window.globalState.players.filter(p => p !== '輪空');
                select.innerHTML = '<option value="">-- 請選擇 --</option>' + realPlayers.map(p => `<option value="${p}">${p}</option>`).join(''); select.disabled = false;
            } else { select.innerHTML = '<option value="">-- 賽事尚未建立 --</option>'; select.disabled = true; }
        }

        function optimizeMatchOrder(matches) {
            if (matches.length <= 2) return matches; let arranged = []; let playerLastPlayed = {};
            arranged.push(matches.shift()); playerLastPlayed[arranged[0].p1] = 0; playerLastPlayed[arranged[0].p2] = 0;
            while (matches.length > 0) {
                let bestIndex = 0; let maxScore = -1;
                for (let i = 0; i < matches.length; i++) {
                    let m = matches[i]; let dist1 = playerLastPlayed[m.p1] !== undefined ? arranged.length - playerLastPlayed[m.p1] : 999; let dist2 = playerLastPlayed[m.p2] !== undefined ? arranged.length - playerLastPlayed[m.p2] : 999;
                    let score = Math.min(dist1, dist2); if (score > maxScore) { maxScore = score; bestIndex = i; }
                }
                let nextMatch = matches.splice(bestIndex, 1)[0]; arranged.push(nextMatch); playerLastPlayed[nextMatch.p1] = arranged.length - 1; playerLastPlayed[nextMatch.p2] = arranged.length - 1;
            } return arranged;
        }

        /* 📊 標準對戰樹佈局（依照國際標準種子排序，實力強者最後碰頭） 📊 */
        function getBracketConfig(bracketSize) {
            if (bracketSize === 4) {
                return [
                    { id: 1, p1SeedIdx: 1, p2SeedIdx: 4, title: "準決賽 1" },
                    { id: 2, p1SeedIdx: 2, p2SeedIdx: 3, title: "準決賽 2" }
                ];
            }
            if (bracketSize === 8) {
                return [
                    { id: 1, p1SeedIdx: 1, p2SeedIdx: 8, title: "八強賽 1" },
                    { id: 2, p1SeedIdx: 4, p2SeedIdx: 5, title: "八強賽 2" },
                    { id: 3, p1SeedIdx: 3, p2SeedIdx: 6, title: "八強賽 3" },
                    { id: 4, p1SeedIdx: 2, p2SeedIdx: 7, title: "八強賽 4" }
                ];
            }
            return [
                { id: 1, p1SeedIdx: 1, p2SeedIdx: 16, title: "16強賽 1" },
                { id: 2, p1SeedIdx: 8, p2SeedIdx: 9,  title: "16強賽 2" },
                { id: 3, p1SeedIdx: 5, p2SeedIdx: 12, title: "16強賽 3" },
                { id: 4, p1SeedIdx: 4, p2SeedIdx: 13, title: "16強賽 4" },
                { id: 5, p1SeedIdx: 3, p2SeedIdx: 14, title: "16強賽 5" },
                { id: 6, p1SeedIdx: 6, p2SeedIdx: 11, title: "16強賽 6" },
                { id: 7, p1SeedIdx: 7, p2SeedIdx: 10, title: "16強賽 7" },
                { id: 8, p1SeedIdx: 2, p2SeedIdx: 15, title: "16強賽 8" }
            ];
        }

        function getRoundTitle(bracketSize) {
            if (bracketSize === 16) return "Round of 16 (16強賽)";
            if (bracketSize === 8) return "Quarter-Finals (八強賽)";
            if (bracketSize === 4) return "Semi-Finals (四強賽)";
            return `淘汰賽 Round of ${bracketSize}`;
        }

        function getMatchTitle(numMatches, index) {
            if (numMatches === 8) return `16強賽 ${index}`;
            if (numMatches === 4) return `八強賽 ${index}`;
            if (numMatches === 2) return `準決賽 ${index}`;
            return `複賽 ${index}`;
        }

        /* 🏆 自適應多層淘汰對戰配對引擎 🏆 */
        function generateKnockoutStructure(numGroups, advancingPerGroup = 2, customBracketSize = null) {
            const totalAdvancing = numGroups * advancingPerGroup;
            let bracketSize = customBracketSize || 2;
            if (!customBracketSize) {
                while (bracketSize < totalAdvancing) { bracketSize *= 2; }
            }
            
            let cols = [];
            let config = getBracketConfig(bracketSize);
            
            let r1Matches = config.map(m => {
                let p1Label = m.p1SeedIdx <= totalAdvancing ? `第 ${m.p1SeedIdx} 順位` : '輪空';
                let p2Label = m.p2SeedIdx <= totalAdvancing ? `第 ${m.p2SeedIdx} 順位` : '輪空';
                
                return {
                    id: `ko_r1_${m.id}`,
                    title: m.title,
                    p1: '', p2: '', s1: 0, s2: 0,
                    p1Seed: p1Label,
                    p2Seed: p2Label,
                    p1SeedIdx: m.p1SeedIdx,
                    p2SeedIdx: m.p2SeedIdx,
                    isRound1: true,
                    nextMatchId: null,
                    loserMatchId: null
                };
            });
            
            cols.push({
                title: getRoundTitle(bracketSize),
                matches: r1Matches
            });
            
            let currentMatches = r1Matches;
            let roundNum = 1;
            let tempSize = bracketSize;
            
            while (tempSize > 2) {
                tempSize /= 2;
                let nextRoundMatchesCount = tempSize / 2;
                let nextMatches = [];
                let isFinalRound = (tempSize === 2);
                
                for (let i = 1; i <= nextRoundMatchesCount; i++) {
                    let title = isFinalRound ? '🥇 冠軍戰' : getMatchTitle(nextRoundMatchesCount, i);
                    nextMatches.push({
                        id: `ko_r${roundNum + 1}_${i}`,
                        title: title,
                        p1: '', p2: '', s1: 0, s2: 0,
                        p1Seed: `勝 R${roundNum}M${i*2 - 1}`,
                        p2Seed: `勝 R${roundNum}M${i*2}`,
                        nextMatchId: null,
                        loserMatchId: null,
                        isFinal: isFinalRound
                    });
                }
                
                currentMatches.forEach((m, idx) => {
                    let targetMatchIdx = Math.ceil((idx + 1) / 2) - 1;
                    if (targetMatchIdx < nextMatches.length) {
                        m.nextMatchId = nextMatches[targetMatchIdx].id;
                    }
                    if (tempSize === 2) {
                        m.loserMatchId = `ko_bronze`;
                    }
                });
                
                if (isFinalRound) {
                    nextMatches.push({
                        id: `ko_bronze`,
                        title: '🥉 季軍戰',
                        p1: '', p2: '', s1: 0, s2: 0,
                        p1Seed: '敗 準決賽1',
                        p2Seed: '敗 準決賽2',
                        isBronze: true
                    });
                }
                
                cols.push({
                    title: isFinalRound ? "Finals (決賽階段)" : getRoundTitle(tempSize),
                    matches: nextMatches
                });
                
                currentMatches = nextMatches;
                roundNum++;
            }
            
            return cols;
        }

        /* 🏅 預賽自動輪空晉級 🏅 */
        function checkAndProcessByes(s) {
            if (!s.knockout) return false;
            let changed = false;
            s.knockout.forEach((col, colIdx) => {
                col.matches.forEach((m, mIdx) => {
                    if (m.p2 === '輪空' && m.p1 && m.p1 !== '輪空' && m.s1 === 0 && m.s2 === 0) {
                        m.s1 = 1; m.s2 = 0;
                        advanceWinner(s, colIdx, mIdx, m.p1, '輪空');
                        changed = true;
                    }
                    if (m.p1 === '輪空' && m.p2 && m.p2 !== '輪空' && m.s1 === 0 && m.s2 === 0) {
                        m.s1 = 0; m.s2 = 1;
                        advanceWinner(s, colIdx, mIdx, m.p2, '輪空');
                        changed = true;
                    }
                });
            });
            return changed;
        }

        /* 🚀 戰績傳輸 🚀 */
        function advanceWinner(s, colIdx, mIdx, winner, loser) {
            const targetMatch = s.knockout[colIdx].matches[mIdx];
            
            if (targetMatch.nextMatchId && colIdx + 1 < s.knockout.length) {
                let nextCol = s.knockout[colIdx + 1];
                let nextMatch = nextCol.matches.find(m => m.id === targetMatch.nextMatchId);
                if (nextMatch) {
                    const predIdx = s.knockout[colIdx].matches.findIndex(m => m.id === targetMatch.id);
                    if (predIdx !== -1) {
                        if (predIdx % 2 === 0) { 
                            nextMatch.p1 = winner || ''; 
                            nextMatch.p1Seed = winner ? `勝 ${targetMatch.title}` : `勝 ${targetMatch.title}`;
                        } else { 
                            nextMatch.p2 = winner || ''; 
                            nextMatch.p2Seed = winner ? `勝 ${targetMatch.title}` : `勝 ${targetMatch.title}`;
                        }
                        
                        // Recursive clearing if score changes to tie or unplayed
                        if (!winner) {
                            const nextMatchIdx = nextCol.matches.findIndex(m => m.id === nextMatch.id);
                            if (nextMatchIdx !== -1) {
                                nextMatch.s1 = 0;
                                nextMatch.s2 = 0;
                                advanceWinner(s, colIdx + 1, nextMatchIdx, '', '');
                            }
                        }
                    }
                }
            }
            
            if (targetMatch.loserMatchId) {
                let finalCol = s.knockout[s.knockout.length - 1];
                let bronzeMatch = finalCol.matches.find(m => m.id === targetMatch.loserMatchId);
                if (bronzeMatch) {
                    const predIdx = s.knockout[colIdx].matches.findIndex(m => m.id === targetMatch.id);
                    if (predIdx !== -1) {
                        if (predIdx % 2 === 0) { 
                            bronzeMatch.p1 = loser || ''; 
                            bronzeMatch.p1Seed = loser ? `敗 ${targetMatch.title}` : `敗 ${targetMatch.title}`;
                        } else { 
                            bronzeMatch.p2 = loser || ''; 
                            bronzeMatch.p2Seed = loser ? `敗 ${targetMatch.title}` : `敗 ${targetMatch.title}`;
                        }
                        if (!loser) {
                            bronzeMatch.s1 = 0;
                            bronzeMatch.s2 = 0;
                        }
                    }
                }
            }
        }

        function generateSingleElimination(players) {
            let cols = []; 
            let numPlayers = players.length; 
            
            // Calculate bracket size (next power of 2) robustly without floats
            let bracketSize = 2;
            while (bracketSize < numPlayers) {
                bracketSize *= 2;
            }
            
            let numRounds = Math.round(Math.log2(bracketSize)); 
            let currentPlayers = [...players]; 
            while(currentPlayers.length < bracketSize) currentPlayers.push('輪空'); 
            currentPlayers.sort(() => Math.random() - 0.5); 
            
            let roundTitles = [];
            for(let i=0; i<numRounds; i++) {
                let mCount = bracketSize / Math.pow(2, i + 1); 
                if (mCount === 1) roundTitles.push('Finals (決賽)'); 
                else if (mCount === 2) roundTitles.push('Semi-Finals (四強)'); 
                else if (mCount === 4) roundTitles.push('Quarter-Finals (八強)'); 
                else roundTitles.push(`Round ${i+1} (${mCount*2}強)`);
            }
            
            let matchIdCounter = 1;
            for(let r=0; r<numRounds; r++) {
                let matchesInRound = bracketSize / Math.pow(2, r + 1); 
                let roundMatches = [];
                let nextRoundStartId = matchIdCounter + matchesInRound;
                
                for(let m=0; m<matchesInRound; m++) {
                    let isFinal = (r === numRounds - 1); 
                    let title = isFinal ? '🥇 冠軍戰' : `Match ${matchIdCounter}`; 
                    let p1 = '', p2 = '', p1Seed = '', p2Seed = '';
                    let loserMatchId = null;
                    if (r === numRounds - 2) loserMatchId = `MBronze`;

                    if (r === 0) { 
                        p1 = currentPlayers[m*2]; 
                        p2 = currentPlayers[m*2 + 1]; 
                        p1Seed = `隨機排籤`; 
                        p2Seed = `隨機排籤`; 
                    } else { 
                        let prevM1 = cols[r-1].matches[m*2].id; 
                        let prevM2 = cols[r-1].matches[m*2 + 1].id; 
                        p1Seed = `勝 ${prevM1}`; 
                        p2Seed = `勝 ${prevM2}`; 
                    }
                    
                    roundMatches.push({ 
                        id: `M${matchIdCounter}`, 
                        title: title, 
                        p1: p1, 
                        p2: p2, 
                        s1: 0, 
                        s2: 0, 
                        p1Seed: p1Seed, 
                        p2Seed: p2Seed, 
                        isFinal: isFinal, 
                        nextMatchId: isFinal ? null : `M${nextRoundStartId + Math.floor(m / 2)}`, 
                        loserMatchId: loserMatchId 
                    }); 
                    matchIdCounter++;
                } 
                cols.push({ title: roundTitles[r], matches: roundMatches });
                
                if (r === numRounds - 1) {
                    cols[r].matches.push({ 
                        id: `MBronze`, 
                        title: '🥉 季軍戰', 
                        p1: '', 
                        p2: '', 
                        s1: 0, 
                        s2: 0, 
                        p1Seed: '敗 準決賽', 
                        p2Seed: '敗 準決賽', 
                        isBronze: true 
                    });
                }
            } 
            return cols;
        }

        function executeGenerateTournament() {

            if (format === 'group') {
                if (players.length < numGroups * 2) { showModal(`小組賽分 ${numGroups} 組至少需要 ${numGroups * 2} 名選手！`); return; } players.sort(() => Math.random() - 0.5);
                groupsData = Array.from({length: numGroups}, (_, i) => ({ id: i, name: groupLabels[i], players: [], matches: [] }));
                players.forEach((p, index) => groupsData[index % numGroups].players.push({ name: p, w: 0, l: 0, scoreDiff: 0, rank: '-' }));
                groupsData.forEach((g) => {
                    let tempMatches = []; for (let i = 0; i < g.players.length; i++) for (let j = i + 1; j < g.players.length; j++) tempMatches.push({ p1: g.players[i].name, p2: g.players[j].name, s1: 0, s2: 0 });
                    g.matches = optimizeMatchOrder(tempMatches).map((m, idx) => ({ id: `g${g.id}_${idx+1}`, p1: m.p1, p2: m.p2, s1: 0, s2: 0 }));
                });
                if (playoffFormat === 'standard') {
                    knockoutData = generateKnockoutStructure(numGroups, advancingPerGroup);
                }
            } else if (format === 'knockout') { 
                knockoutData = generateSingleElimination(players); 
            } 

            const raffleData = {
                candidates: players.map(p => ({ name: p, active: true })),

            };

            const newState = { 
                players: players, 
                format: format, 
                numGroups: format==='group'?numGroups:0, 
                advancingPerGroup: advancingPerGroup,

                groupTargetScore: groupTargetScore,
                playoffTargetScore: playoffTargetScore,
                avoidSameGroup: avoidSameGroup,
                groups: groupsData, 
                knockout: knockoutData,
                playoffState: null,
                raffle: raffleData
            };
            
            // Auto-advance Byes ("輪空") on tournament generation
            checkAndProcessByes(newState);
            
            setDoc(window.docRef, newState).then(() => { showModal("🚀 大會新賽程已成功發布並同步！"); }).catch((e) => { showModal("發布失敗: " + e.message); });
        }

        function executeResetTournament() {

        }

        /* ⚔️ 小組排位全大會公平大排名與決賽生成 ⚔️ */
        window.advanceGroupWinners = async function() {
            if (!window.globalState || !window.globalState.groups) return;
            let s = JSON.parse(JSON.stringify(window.globalState));
            
            const numGroups = s.numGroups;
            const advancingPerGroup = s.advancingPerGroup || 2;
            const playoffFormat = s.playoffFormat || 'standard';
            const avoidSameGroup = s.avoidSameGroup !== false;
            
            // 依名次搜集出線選手 (Rank 1, Rank 2, Rank 3...)
            let advancingTiers = Array.from({length: advancingPerGroup}, () => []);
            
            s.groups.forEach(g => {
                let sortedGroupPlayers = [...g.players].sort((a, b) => {
                    let rA = parseInt(a.rank) || 999;
                    let rB = parseInt(b.rank) || 999;
                    if (rA !== rB) return rA - rB;
                    if (b.w !== a.w) return b.w - a.w;
                    return b.scoreDiff - a.scoreDiff;
                });
                
                for (let r = 0; r < advancingPerGroup; r++) {
                    if (sortedGroupPlayers[r]) {
                        advancingTiers[r].push({
                            name: sortedGroupPlayers[r].name,
                            group: g.name,
                            w: sortedGroupPlayers[r].w,
                            scoreDiff: sortedGroupPlayers[r].scoreDiff,
                            groupRank: r + 1
                        });
                    }
                }
            });
            
            const sortPerformance = (a, b) => {
                if (b.w !== a.w) return b.w - a.w;
                return b.scoreDiff - a.scoreDiff;
            };
            
            advancingTiers.forEach(tier => tier.sort(sortPerformance));
            
            let allAdvancing = [];
            advancingTiers.forEach(tier => allAdvancing.push(...tier));
            
            if (allAdvancing.length === 0) {
                showModal("無晉級選手，請確認預賽戰績！"); return;
            }

            // 模式 1：6強對決 ➔ 3強決賽單循環 (six_to_three)
            if (playoffFormat === 'six_to_three') {
                if (allAdvancing.length !== 6) {
                    showModal(`💡 提示：「6強對決」模式建議 6 人晉級（目前有 ${allAdvancing.length} 人）。已自動依戰績排名前 6 名進入 6強對決！`);
                    allAdvancing = allAdvancing.slice(0, 6);
                }
                
                let p1 = allAdvancing[0], p2 = allAdvancing[1], p3 = allAdvancing[2];
                let p4 = allAdvancing[3], p5 = allAdvancing[4], p6 = allAdvancing[5];

                // 同組避讓
                if (avoidSameGroup && p1 && p2 && p3 && p4 && p5 && p6) {
                    if (p1.group === p6.group) { let tmp = p6; p6 = p5; p5 = tmp; }
                    if (p2.group === p5.group) { let tmp = p5; p5 = p4; p4 = tmp; }
                    if (p3.group === p4.group && p3.group !== p5.group) { let tmp = p4; p4 = p5; p5 = tmp; }
                }

                s.playoffState = {
                    mode: 'six_to_three',
                    step: 1,
                    pkMatches: [
                        { id: 'pk_1', title: '⚔️ 6強複賽 PK 1', p1: p1.name, p2: p6.name, p1Seed: `${p1.group}組#${p1.groupRank}`, p2Seed: `${p6.group}組#${p6.groupRank}`, s1: 0, s2: 0 },
                        { id: 'pk_2', title: '⚔️ 6強複賽 PK 2', p1: p2.name, p2: p5.name, p1Seed: `${p2.group}組#${p2.groupRank}`, p2Seed: `${p5.group}組#${p5.groupRank}`, s1: 0, s2: 0 },
                        { id: 'pk_3', title: '⚔️ 6強複賽 PK 3', p1: p3.name, p2: p4.name, p1Seed: `${p3.group}組#${p3.groupRank}`, p2Seed: `${p4.group}組#${p4.groupRank}`, s1: 0, s2: 0 }
                    ],
                    finalRRMatches: null,
                    finalRRTable: null
                };
                delete s.knockout;
                await setDoc(window.docRef, s);
                showModal("🔥 已成功生成 6強 PK 複賽賽程（0輪空）！完成 3 場對決後將自動展開【3強大決賽單循環】！");
                return;
            }

            // 模式 2：晉級者全單循環大決戰 (full_rr)
            if (playoffFormat === 'full_rr') {
                let rrRawMatches = [];
                for (let i = 0; i < allAdvancing.length; i++) {
                    for (let j = i + 1; j < allAdvancing.length; j++) {
                        rrRawMatches.push({ p1: allAdvancing[i].name, p2: allAdvancing[j].name, s1: 0, s2: 0 });
                    }
                }
                s.playoffState = {
                    mode: 'full_rr',
                    players: allAdvancing.map(p => ({ name: p.name, group: p.group, w: 0, l: 0, scoreDiff: 0, rank: '-' })),
                    matches: optimizeMatchOrder(rrRawMatches).map((m, idx) => ({ id: `frr_${idx+1}`, title: `🏆 全單循環 M${idx+1}`, p1: m.p1, p2: m.p2, s1: 0, s2: 0 }))
                };
                delete s.knockout;
                await setDoc(window.docRef, s);
                showModal("👑 已成功為所有晉級選手生成【全單循環大決戰】賽程！");
                return;
            }

            // 模式 3：標準單淘汰賽 (standard)
            const totalAdvancing = allAdvancing.length;
            let bracketSize = 2;
            while (bracketSize < totalAdvancing) { bracketSize *= 2; }
            
            s.knockout = generateKnockoutStructure(numGroups, advancingPerGroup, bracketSize);
            delete s.playoffState;
            
            let seeds = Array(bracketSize + 1).fill('輪空');
            for (let i = 0; i < allAdvancing.length; i++) {
                seeds[i + 1] = allAdvancing[i];
            }
            
            let config = getBracketConfig(bracketSize);
            if (avoidSameGroup && config) {
                let maxAttempts = 100, attempts = 0, hasConflict = true;
                while (hasConflict && attempts < maxAttempts) {
                    hasConflict = false; attempts++;
                    for (let m of config) {
                        let p1 = seeds[m.p1SeedIdx], p2 = seeds[m.p2SeedIdx];
                        if (p1 && p2 && p1 !== '輪空' && p2 !== '輪空' && p1.group === p2.group) {
                            hasConflict = true;
                            let targetIdx = m.p2SeedIdx;
                            for (let swapCandidate = 2; swapCandidate <= totalAdvancing; swapCandidate++) {
                                if (swapCandidate !== targetIdx && seeds[swapCandidate] !== '輪空' && seeds[swapCandidate].group !== p1.group) {
                                    let temp = seeds[targetIdx]; seeds[targetIdx] = seeds[swapCandidate]; seeds[swapCandidate] = temp;
                                    break;
                                }
                            }
                        }
                    }
                }
            }
            
            if (s.knockout && s.knockout[0]) {
                s.knockout[0].matches.forEach(m => {
                    let p1Obj = seeds[m.p1SeedIdx];
                    let p2Obj = seeds[m.p2SeedIdx];
                    m.p1 = p1Obj === '輪空' ? '輪空' : (p1Obj ? p1Obj.name : '');
                    m.p2 = p2Obj === '輪空' ? '輪空' : (p2Obj ? p2Obj.name : '');
                    if (p1Obj && p1Obj !== '輪空') m.p1Seed = `${p1Obj.group}組#${p1Obj.groupRank}`;
                    if (p2Obj && p2Obj !== '輪空') m.p2Seed = `${p2Obj.group}組#${p2Obj.groupRank}`;
                });
                checkAndProcessByes(s);
                await setDoc(window.docRef, s);
                showModal("🎉 預賽勝出者已依戰績公平帶入決賽樹狀圖！");
            }
        }

                if (ps.pkMatches) {
                    for (let m of ps.pkMatches) { if ((m.p1 === pName || m.p2 === pName) && m.s1 === 0 && m.s2 === 0) { nextMatch = m; matchType = m.title; break; } }

                if (!nextMatch && ps.finalRRMatches) {
                    for (let m of ps.finalRRMatches) { if ((m.p1 === pName || m.p2 === pName) && m.s1 === 0 && m.s2 === 0) { nextMatch = m; matchType = m.title; break; } }

            let s = JSON.parse(JSON.stringify(window.globalState));
            if (type === 'g_m') {
                s.groups[idx1].matches[idx2][key] = Math.max(0, s.groups[idx1].matches[idx2][key] + val);
                recalculateGroupStandings(s, idx1);
            }
            else if (type === 'k_m') {
                s.knockout[idx1].matches[idx2][key] = Math.max(0, s.knockout[idx1].matches[idx2][key] + val);
                const m = s.knockout[idx1].matches[idx2];
                let winner = ''; let loser = '';
                if (m.s1 > m.s2) { winner = m.p1; loser = m.p2; }
                else if (m.s2 > m.s1) { winner = m.p2; loser = m.p1; }
                
                advanceWinner(s, idx1, idx2, winner, loser);
                checkAndProcessByes(s);
            }
            else if (type === 'pk_m') {
                if (s.playoffState && s.playoffState.pkMatches) {
                    s.playoffState.pkMatches[idx2][key] = Math.max(0, s.playoffState.pkMatches[idx2][key] + val);
                    
                    // 檢查 3 場 PK 賽是否全數打完
                    let completed = s.playoffState.pkMatches.every(m => m.s1 !== m.s2 && (m.s1 > 0 || m.s2 > 0));
                    if (completed) {
                        let winners = s.playoffState.pkMatches.map(m => m.s1 > m.s2 ? m.p1 : m.p2);
                        s.playoffState.step = 2;
                        let w1 = winners[0], w2 = winners[1], w3 = winners[2];
                        s.playoffState.finalRRMatches = [
                            { id: 'frr_1', title: '🏆 3強決賽 M1', p1: w1, p2: w2, s1: 0, s2: 0 },
                            { id: 'frr_2', title: '🏆 3強決賽 M2', p1: w2, p2: w3, s1: 0, s2: 0 },
                            { id: 'frr_3', title: '🏆 3強決賽 M3', p1: w3, p2: w1, s1: 0, s2: 0 }
                        ];
                        s.playoffState.finalRRTable = [
                            { name: w1, w: 0, l: 0, scoreDiff: 0, rank: '-' },
                            { name: w2, w: 0, l: 0, scoreDiff: 0, rank: '-' },
                            { name: w3, w: 0, l: 0, scoreDiff: 0, rank: '-' }
                        ];
                    }
                }
            }
            else if (type === 'frr_m') {
                if (s.playoffState) {
                    let matchArray = s.playoffState.finalRRMatches || s.playoffState.matches;
                    let tableArray = s.playoffState.finalRRTable || s.playoffState.players;
                    if (matchArray && matchArray[idx2]) {
                        matchArray[idx2][key] = Math.max(0, matchArray[idx2][key] + val);
                        recalculateRRStandings(tableArray, matchArray);
                    }
                }
            }
            else if (type === 'frr_p') {
                if (s.playoffState) {
                    let tableArray = s.playoffState.finalRRTable || s.playoffState.players;
                    if (tableArray && tableArray[idx2]) {
                        if (key === 'scoreDiff') tableArray[idx2][key] += val;
                        else tableArray[idx2][key] = Math.max(0, tableArray[idx2][key] + val);
                    }
                }
            }
            else if (type === 'frr_r') {
                if (s.playoffState) {
                    let tableArray = s.playoffState.finalRRTable || s.playoffState.players;
                    if (tableArray && tableArray[idx2]) tableArray[idx2][key] = val;
                }
            }
            else if (type === 'g_p') {
                if(key=='scoreDiff') s.groups[idx1].players[idx2][key] += val;
                else s.groups[idx1].players[idx2][key] = Math.max(0, s.groups[idx1].players[idx2][key] + val);
            }
            else if (type === 'g_r') s.groups[idx1].players[idx2][key] = val;
            else if (type === 'k_n') s.knockout[idx1].matches[idx2][key] = val;
            
            saveState(s);
        }

        function recalculateRRStandings(tableArray, matchArray) {
            tableArray.forEach(p => { p.w = 0; p.l = 0; p.scoreDiff = 0; p.rank = '-'; });
            matchArray.forEach(m => {
                if (m.s1 === 0 && m.s2 === 0) return;
                let p1Obj = tableArray.find(x => x.name === m.p1);
                let p2Obj = tableArray.find(x => x.name === m.p2);
                if (p1Obj && p2Obj) {
                    p1Obj.scoreDiff += (m.s1 - m.s2); p2Obj.scoreDiff += (m.s2 - m.s1);
                    if (m.s1 > m.s2) { p1Obj.w += 1; p2Obj.l += 1; }
                    else if (m.s2 > m.s1) { p2Obj.w += 1; p1Obj.l += 1; }
                }
            });
            let rankSort = [...tableArray].sort((a, b) => {
                if (b.w !== a.w) return b.w - a.w;
                return b.scoreDiff - a.scoreDiff;
            });
            tableArray.forEach(p => {
                let finalIdx = rankSort.findIndex(x => x.name === p.name);
                p.rank = finalIdx + 1;
            });
        }

        function recalculateGroupStandings(s, gIdx) {
            s.groups[gIdx].players.forEach(p => { p.w = 0; p.l = 0; p.scoreDiff = 0; p.rank = '-'; });
            s.groups[gIdx].matches.forEach(m => {
                if (m.s1 === 0 && m.s2 === 0) return; 
                let p1Obj = s.groups[gIdx].players.find(x => x.name === m.p1);
                let p2Obj = s.groups[gIdx].players.find(x => x.name === m.p2);
                if (p1Obj && p2Obj) {
                    p1Obj.scoreDiff += (m.s1 - m.s2); p2Obj.scoreDiff += (m.s2 - m.s1);
                    if (m.s1 > m.s2) { p1Obj.w += 1; p2Obj.l += 1; } 
                    else if (m.s2 > m.s1) { p2Obj.w += 1; p1Obj.l += 1; }
                }
            });
            let rankSort = [...s.groups[gIdx].players].sort((a, b) => {
                if (b.w !== a.w) return b.w - a.w; 
                return b.scoreDiff - a.scoreDiff;
            });
            s.groups[gIdx].players.forEach(p => {
                let finalIdx = rankSort.findIndex(x => x.name === p.name); 
                p.rank = finalIdx + 1;
            });
        }

        async function saveState(s) {
            try { await setDoc(window.docRef, s); } catch(e) { console.error("儲存失敗", e); }
        }

        /* ⚔️ 比分快速增減控制器 (支持直接點擊大數字快速 +1) ⚔️ */
        window.addSbScore = function(p, pts) {
            if (sbGameOver && pts > 0) return;
            sbScores[p] = Math.max(0, sbScores[p] + pts);
            let scoreEl = document.getElementById(`sb-score-${p}`);
            scoreEl.innerText = sbScores[p];
            
            scoreEl.classList.remove('scale-105'); 
            void scoreEl.offsetWidth; 
            scoreEl.classList.add('scale-105');

            if (pts > 0) {
                let cardEl = scoreEl.closest('.sb-player-card');
                if (cardEl) {
                    cardEl.classList.remove('score-changed');
                    void cardEl.offsetWidth;
                    cardEl.classList.add('score-changed');
                }
            }
            
            if (pts > 0) checkSbWinner();
        }
        
        window.resetSbPlayer = function(p) { 
            sbScores[p] = 0; 
            document.getElementById(`sb-score-${p}`).innerText = "0"; 
        }
        
        window.resetAllAndCloseSbVictory = function() {
            sbScores = { 1: 0, 2: 0 };
            document.getElementById('sb-score-1').innerText = "0"; 
            document.getElementById('sb-score-2').innerText = "0";
            document.getElementById('sb-victory-screen').classList.remove('active');
            sbGameOver = false;
        }

        window.submitAndCloseSbVictory = async function() {
            if (currentLoadedMatchContext && window.globalState) {
                let s = JSON.parse(JSON.stringify(window.globalState));
                const ctx = currentLoadedMatchContext;
                
                if (ctx.type === 'group') {
                    let targetMatch = s.groups[ctx.gIdx].matches[ctx.mIdx];
                    targetMatch.s1 = sbScores[1]; targetMatch.s2 = sbScores[2];
                    recalculateGroupStandings(s, ctx.gIdx);

                } else if (ctx.type === 'knockout') {
                    let targetCol = s.knockout[ctx.cIdx];
                    let targetMatch = targetCol.matches[ctx.mIdx];
                    targetMatch.s1 = sbScores[1]; targetMatch.s2 = sbScores[2];
                    
                    let winner = ''; let loser = '';
                    if (sbScores[1] > sbScores[2]) { winner = targetMatch.p1; loser = targetMatch.p2; } 
                    else if (sbScores[2] > sbScores[1]) { winner = targetMatch.p2; loser = targetMatch.p1; }
                    
                    if (winner !== '') {
                        advanceWinner(s, ctx.cIdx, ctx.mIdx, winner, loser);
                        checkAndProcessByes(s);
                    }
                } else if (ctx.type === 'pk') {
                    if (s.playoffState && s.playoffState.pkMatches) {
                        let targetMatch = s.playoffState.pkMatches[ctx.mIdx];
                        targetMatch.s1 = sbScores[1]; targetMatch.s2 = sbScores[2];
                        let completed = s.playoffState.pkMatches.every(m => m.s1 !== m.s2 && (m.s1 > 0 || m.s2 > 0));
                        if (completed) {
                            let winners = s.playoffState.pkMatches.map(m => m.s1 > m.s2 ? m.p1 : m.p2);
                            s.playoffState.step = 2;
                            let w1 = winners[0], w2 = winners[1], w3 = winners[2];
                            s.playoffState.finalRRMatches = [
                                { id: 'frr_1', title: '🏆 3強決賽 M1', p1: w1, p2: w2, s1: 0, s2: 0 },
                                { id: 'frr_2', title: '🏆 3強決賽 M2', p1: w2, p2: w3, s1: 0, s2: 0 },
                                { id: 'frr_3', title: '🏆 3強決賽 M3', p1: w3, p2: w1, s1: 0, s2: 0 }
                            ];
                            s.playoffState.finalRRTable = [
                                { name: w1, w: 0, l: 0, scoreDiff: 0, rank: '-' },
                                { name: w2, w: 0, l: 0, scoreDiff: 0, rank: '-' },
                                { name: w3, w: 0, l: 0, scoreDiff: 0, rank: '-' }
                            ];
                        }
                    }
                } else if (ctx.type === 'frr') {
                    if (s.playoffState) {
                        let matchArray = s.playoffState.finalRRMatches || s.playoffState.matches;
                        let tableArray = s.playoffState.finalRRTable || s.playoffState.players;
                        if (matchArray && matchArray[ctx.mIdx]) {
                            matchArray[ctx.mIdx].s1 = sbScores[1];
                            matchArray[ctx.mIdx].s2 = sbScores[2];
                            recalculateRRStandings(tableArray, matchArray);
                        }
                    }
                }
                await setDoc(window.docRef, s);
            }
            currentLoadedMatchContext = null;
            
            const btnScore = document.getElementById('tab-btn-score');
            if (btnScore) {
                btnScore.classList.add('hidden');
            }
            
            resetAllAndCloseSbVictory();
            window.switchTab('main');
        }

        // 修改點：完全不儲存當前點數直接安全返回（誤觸、臨時取消）
        window.exitScoreboardWithoutSaving = function() {
            currentLoadedMatchContext = null;
            const btnScore = document.getElementById('tab-btn-score');
            if (btnScore) {
                btnScore.classList.add('hidden');
            }
            resetAllAndCloseSbVictory();
            window.switchTab('main');
        }

        window.checkSbWinner = function() {
            let target = parseInt(document.getElementById('sb-winCondition').value);
            let screen = document.getElementById('sb-victory-screen');
            if (sbScores[1] >= target) {
                sbGameOver = true; 
                document.getElementById('sb-winner-name').innerText = document.getElementById('sb-name-1').value; 
                screen.classList.add('active');
            } else if (sbScores[2] >= target) {
                sbGameOver = true; 
                document.getElementById('sb-winner-name').innerText = document.getElementById('sb-name-2').value; 
                screen.classList.add('active');
            }
        }

        window.showModal = function(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').classList.remove('hidden');
        }
        
        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        }
        
        window.logout = function() {
            localStorage.removeItem(`role_${appId}_${tournamentId}`);
            window.userRole = null;
            renderApp();
        }



        // Raffle screen dynamic render
        function renderRaffleScreen() {
            const s = window.globalState;
            if (!s) return;
            
            // Backward compatibility: initialize raffle if missing
            if (!s.raffle) {
                s.raffle = {
                    candidates: s.players ? s.players.map(p => ({ name: p, active: true })) : [],
                    winners: []
                };
            }
            
            const isAdmin = window.userRole === 'admin';
            
            // Set counts
            const pool = s.raffle.candidates.filter(c => c.active && !s.raffle.winners.includes(c.name));
            document.getElementById('raffle-candidate-count').innerText = pool.length;
            document.getElementById('raffle-winner-count').innerText = s.raffle.winners.length;
            
            // Render Candidates
            const candList = document.getElementById('raffle-candidates-list');
            if (candList) {
                candList.innerHTML = s.raffle.candidates.map(c => {
                    const isWinner = s.raffle.winners.includes(c.name);
                    const disabledStr = isAdmin ? '' : 'disabled';
                    const activeClass = c.active ? 'text-black' : 'text-gray-400 bg-gray-100 border-dashed opacity-60';
                    const winnerBadge = isWinner ? '<span class="text-xs bg-green-500 text-white px-2 py-0.5 rounded-lg">已中獎</span>' : '';
                    const cursorClass = isAdmin ? 'cursor-pointer hover:bg-gray-50' : 'cursor-not-allowed';
                    
                    return `
                        <label class="flex items-center justify-between p-2.5 bg-white border-2 border-black rounded-xl font-bold transition-all ${cursorClass} ${activeClass}">
                            <div class="flex items-center gap-2">
                                <span>${c.name}</span>
                                ${winnerBadge}
                            </div>
                            <input type="checkbox" class="w-5 h-5 accent-red-600" ${c.active ? 'checked' : ''} ${disabledStr} onchange="toggleCandidateActive('${c.name}', this.checked)">
                        </label>
                    `;
                }).join('');
            }
            
            // Render Winners
            const winList = document.getElementById('raffle-winners-list');
            if (winList) {
                if (s.raffle.winners.length === 0) {
                    winList.innerHTML = `<div class="text-gray-400 text-center font-bold py-10">🎁 尚未有中獎名單，快來抽獎吧！</div>`;
                } else {
                    winList.innerHTML = s.raffle.winners.map((w, idx) => {
                        return `
                            <div class="flex items-center justify-between p-3 bg-green-50 border-2 border-green-600 rounded-xl font-black text-green-700 animate-fade-in shadow-[2px_2px_0px_rgba(22,101,52,0.15)]">
                                <span class="flex items-center gap-1.5">🎉 第 ${idx + 1} 位幸運兒：<strong class="text-lg text-green-800">${w}</strong></span>
                                ${isAdmin ? `<button class="text-xs text-red-600 underline font-black hover:text-red-800" onclick="removeWinner('${w}')">重抽</button>` : ''}
                            </div>
                        `;
                    }).join('');
                }
            }
            
            // Show/Hide admin actions
            const drawBtn = document.getElementById('raffle-draw-btn');
            const resetBtn = document.getElementById('raffle-reset-btn');
            const noticeEl = document.getElementById('raffle-player-notice');
            if (drawBtn) drawBtn.style.display = isAdmin ? 'block' : 'none';
            if (resetBtn) resetBtn.style.display = isAdmin ? 'block' : 'none';
            if (noticeEl) noticeEl.style.display = isAdmin ? 'none' : 'block';
        }

        let isDrawing = false;
        window.triggerRaffleDraw = function() {
            if (isDrawing) return;
            const s = JSON.parse(JSON.stringify(window.globalState));
            if (!s.raffle) {
                s.raffle = {
                    candidates: s.players ? s.players.map(p => ({ name: p, active: true })) : [],
                    winners: []
                };
            }
            
            // Get active candidates who are not already drawn
            const pool = s.raffle.candidates.filter(c => c.active && !s.raffle.winners.includes(c.name));
            if (pool.length === 0) {
                showModal("❌ 沒有符合抽獎條件認的候選人！（請檢查是否有啟用候選人，或候選人已全部中獎）");
                return;
            }
            
            isDrawing = true;
            const display = document.getElementById('raffle-display-name');
            const drawBtn = document.getElementById('raffle-draw-btn');
            drawBtn.disabled = true;
            drawBtn.innerText = "⚡ 抽獎中...";
            
            let count = 0;
            const interval = setInterval(() => {
                const tempWinner = pool[Math.floor(Math.random() * pool.length)].name;
                display.innerText = "🎲 " + tempWinner;
                count++;
                if (count > 25) {
                    clearInterval(interval);
                    
                    // Final draw outcome
                    const finalWinnerName = pool[Math.floor(Math.random() * pool.length)].name;
                    display.innerText = "🎉 " + finalWinnerName;
                    
                    // Update state and save to Firestore
                    s.raffle.winners.push(finalWinnerName);
                    saveState(s);
                    
                    isDrawing = false;
                    drawBtn.disabled = false;
                    drawBtn.innerText = "🎁 開始抽獎!";
                    
                    showModal(`🎊 恭喜！中獎人是：${finalWinnerName}`);
                }
            }, 100);
        }

        window.toggleCandidateActive = function(name, checked) {
            let s = JSON.parse(JSON.stringify(window.globalState));
            if (!s.raffle) return;
            const cand = s.raffle.candidates.find(c => c.name === name);
            if (cand) {
                cand.active = checked;
                saveState(s);
            }
        }
        
        window.triggerRaffleReset = function() {
            if (!confirm("確定要重設抽獎名單嗎？這會清除所有已中獎記錄，並重新啟用所有候選人！")) return;
            let s = JSON.parse(JSON.stringify(window.globalState));
            s.raffle = {
                candidates: s.players ? s.players.map(p => ({ name: p, active: true })) : [],
                winners: []
            };
            const display = document.getElementById('raffle-display-name');
            if (display) display.innerText = "❓ 準備抽取";
            saveState(s);
        }
        
        window.removeWinner = function(name) {
            let s = JSON.parse(JSON.stringify(window.globalState));
            if (!s.raffle) return;
            s.raffle.winners = s.raffle.winners.filter(w => w !== name);
            saveState(s);
        }

        // Copy Share Link helper
        window.copyShareLink = function() {
            const url = new URL(window.location.href);
            url.searchParams.set('t', tournamentId);
            url.hash = ''; // Clear hash to prevent duplicate states
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                showModal("📋 賽程分享連結已複製到剪貼簿！可直接傳給參賽者。");
            }).catch(() => {
                showModal("複製失敗，請手動複製網址：" + url.toString());
            });
        }

        window.onload = function() {
            init();
            
            // 手動註冊 Tab 事件，完美保障 module 與 classList 的正常運作
            document.getElementById('tab-btn-main').addEventListener('click', () => switchTab('main'));
            document.getElementById('tab-btn-score').addEventListener('click', () => switchTab('score'));
            document.getElementById('tab-btn-raffle').addEventListener('click', () => switchTab('raffle'));

            const confirmBtn = document.getElementById('auth-confirm-btn');
            if(confirmBtn) {
                confirmBtn.onclick = function(e) {
                    e.preventDefault(); 
                    verifyAndExecuteAction();
                };
            }
        };
    </script>
